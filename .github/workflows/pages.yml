name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - name: Build photo gallery
        run: python3 scripts/build-photo-gallery.py

      - name: Check pages and interactions
        run: |
          python3 scripts/check-site.py
          node --check dist/site.js
          node --check dist/motion.js
          node --check dist/ashiato/album.js
          node scripts/test-motion.cjs
          node scripts/test-interactions.cjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
